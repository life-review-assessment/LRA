<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>LRA 復旧</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f3ed;color:#171613;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.box{padding:32px;text-align:center}.box b{display:block;font-size:22px;margin-bottom:12px}.box p{font-size:13px;line-height:1.8;color:#5c574f}</style>
</head>
<body>
  <div class="box"><b id="title">LRAを復旧しています</b><p id="text">数秒で通常画面へ戻ります。</p></div>
  <script>
    (async()=>{
      const title=document.getElementById('title');
      const text=document.getElementById('text');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        try{sessionStorage.removeItem('lra.cloudflare.recovery');}catch{}
        title.textContent='復旧しました';
        text.textContent='通常画面へ移動します。';
        const url='./index.html?lra_recovered=20261015-1';
        setTimeout(()=>location.replace(url),350);
      }catch(e){
        title.textContent='復旧処理を再実行してください';
        text.textContent='このページを更新してください。';
      }
    })();
  </script>
</body>
</html>
