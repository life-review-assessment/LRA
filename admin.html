<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f4f2ed"><link rel="stylesheet" href="./assets/style.css"><title>LRA Admin</title><style>.admin-shell{max-width:1100px;margin:0 auto;padding:32px 18px 80px}.admin-head{display:flex;justify-content:space-between;gap:24px;align-items:end;padding:18px 0 28px;border-bottom:1px solid rgba(17,17,15,.2)}.admin-head h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(36px,7vw,72px);font-weight:400}.admin-note{max-width:540px;color:#777268}.admin-grid{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.6fr);gap:18px;margin-top:24px}.admin-panel{background:#fff;border:1px solid rgba(17,17,15,.14);padding:18px}.admin-list{display:grid;gap:10px;max-height:70vh;overflow:auto}.admin-row{width:100%;text-align:left;background:transparent;border:1px solid rgba(17,17,15,.14);padding:14px;cursor:pointer}.admin-row.active{background:#11110f;color:#f4f2ed}.admin-row small,.admin-row span{display:block}.admin-row b{display:block;margin:5px 0}.admin-empty{padding:22px 0;color:#777268}.admin-detail{display:grid;gap:14px}.admin-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.admin-meta div{border:1px solid rgba(17,17,15,.12);padding:12px}.admin-meta span{display:block;font-size:11px;color:#777268;letter-spacing:.08em}.admin-meta b{display:block;margin-top:5px;word-break:break-all}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-textarea{width:100%;min-height:280px;padding:14px;border:1px solid rgba(17,17,15,.2);background:#fbfaf7;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.admin-status{font-size:12px;color:#777268}.admin-warning{margin-top:18px;padding:14px;border:1px solid rgba(17,17,15,.25);font-size:13px}.hidden-admin{display:none!important}@media(max-width:760px){.admin-grid{grid-template-columns:1fr}.admin-meta{grid-template-columns:1fr}.admin-head{display:block}.admin-note{margin-top:12px}}</style></head><body><main class="admin-shell"><header class="admin-head"><div><p class="site-kicker">LRA ADMIN</p><h1>Analysis Desk</h1></div><p class="admin-note">回答パケット、分析結果、分析回数、状態を確認する管理ワークスペース。公開ユーザー画面からはリンクしません。</p></header><div id="authGate" class="admin-warning">管理者認証が未接続のため、現在はこの端末内のLRA記録だけを扱います。</div><section class="admin-grid"><aside class="admin-panel"><div class="site-kicker">RECORDS</div><div id="recordList" class="admin-list"></div></aside><section class="admin-panel"><div id="detailEmpty" class="admin-empty">記録を選択してください。</div><div id="detail" class="admin-detail hidden-admin"><div class="admin-meta"><div><span>LRA-ID</span><b id="dLraId"></b></div><div><span>USER-ID</span><b id="dUserId"></b></div><div><span>ANALYSIS</span><b id="dCount"></b></div><div><span>STATUS</span><b id="dStatus"></b></div><div><span>OUTPUT-ID</span><b id="dOutputId"></b></div><div><span>SAVED</span><b id="dSaved"></b></div></div><div class="admin-actions"><button class="btn dark" id="copyPromptBtn">ChatGPT分析依頼をコピー</button><button class="btn" id="copyPacketBtn">分析パケットをコピー</button><button class="btn" id="copyResultBtn">分析結果をコピー</button><button class="btn" id="exportResultBtn">分析結果を書き出す</button><button class="btn" id="exportAllBtn">全記録を書き出す</button><label class="btn">記録を読み込む<input id="importFile" type="file" accept="application/json" hidden></label></div><div><p class="site-kicker">PACKET / REVIEWED RESULT</p><textarea id="payload" class="admin-textarea" spellcheck="false"></textarea></div><div class="admin-actions"><button class="btn dark" id="saveResultBtn">レビュー済み結果を保存</button><button class="btn" id="markReviewBtn">レビュー待ちにする</button><button class="btn" id="markCompleteBtn">完了にする</button></div><div id="adminStatus" class="admin-status"></div></div></section></section></main><script type="module" src="./assets/admin.js"></script></body></html>
