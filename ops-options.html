<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f4f2ed"><title>LRA オプション管理</title>
<style>
body{margin:0;background:#f4f2ed;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.w{max-width:860px;margin:auto;padding:28px 16px 80px}.top{border-top:1px solid #111;padding-top:18px}.ey{font-size:10px;letter-spacing:.18em;color:#777}.ttl{font:400 44px Georgia,"Yu Mincho",serif;margin:12px 0}.lead{font-size:13px;line-height:1.8;color:#555}.hide{display:none}.box,.item,.panel{border:1px solid #ccc;background:#faf8f3;padding:15px;margin:10px 0}.inp,.text{width:100%;box-sizing:border-box;padding:13px;font-size:16px;border:1px solid #bbb;background:#fff;margin:7px 0}.text{min-height:220px;resize:vertical}.btn{padding:13px 16px;border:1px solid #111;background:#111;color:#fff;font-weight:700}.sub{background:transparent;color:#111}.bad{color:#922}.ok{color:#315d38}.item{width:100%;text-align:left;color:#111}.meta{font-size:11px;color:#777;line-height:1.7;margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 180px}.row .btn{flex:0 0 auto}.badge{display:inline-block;border:1px solid #bbb;border-radius:999px;padding:3px 8px;font-size:10px;margin:5px 0}.pending{border-color:#7b2c2c;color:#7b2c2c}.done{border-color:#315d38;color:#315d38}.section{border-top:1px solid #111;margin-top:26px;padding-top:20px}.section h3{font:400 25px Georgia,"Yu Mincho",serif;margin:0 0 10px}.pre{white-space:pre-wrap;font-size:12px;line-height:1.8;border:1px solid #ddd;background:#fff;padding:14px;max-height:320px;overflow:auto}.empty{padding:24px 0;color:#777}.copy-note{font-size:12px;min-height:20px;margin:9px 0}@media(max-width:640px){.ttl{font-size:38px}.row .btn{flex:1 1 auto}}
</style>
</head>
<body><main class="w">
<div class="top"><div class="ey">LRA PRIVATE OPERATOR / OPTIONS</div></div>
<section id="auth"><h1 class="ttl">オプション管理</h1><p class="lead">通常LRAとは分離した、追加分析・追跡専用の管理画面です。</p><div class="box"><input id="pin" class="inp" inputmode="numeric" maxlength="12" placeholder="管理PIN"><button id="login" class="btn">ログイン →</button></div><p id="msg" class="lead"></p></section>
<section id="listPage" class="hide"><div class="row"><div><div class="ey">OPTION QUEUE</div><h1 class="ttl">オプション案件</h1></div><button id="refresh" class="btn sub">更新</button></div><input id="search" class="inp" placeholder="LRA-ID / User-ID / 注文番号 / 商品"><div id="count" class="lead"></div><div id="list"></div></section>
<section id="detail" class="hide"><button id="back" class="btn sub">← 一覧へ</button><h1 id="title" class="ttl"></h1><div id="meta" class="meta"></div><div id="status"></div>
<div class="section"><h3>GPT分析用パケット</h3><p class="lead">元の内部分析結果＋購入後の追加情報を一括コピーします。該当するオプション分析チャットへ貼り付けてください。</p><button id="copy" class="btn">分析パケットをコピー</button><div id="copyMsg" class="copy-note"></div></div>
<div class="section"><h3>購入後の入力</h3><div id="input" class="pre"></div></div>
<div class="section"><h3>元LRA内部分析結果</h3><div id="baseAnalysis" class="pre"></div></div>
<div class="section"><h3>内部分析結果</h3><textarea id="analysis" class="text" placeholder="オプション内部分析結果を全文貼り付け"></textarea><button id="saveAnalysis" class="btn">分析結果を保存</button><div id="analysisMsg" class="copy-note"></div></div>
<div class="section"><h3>顧客向けレポート</h3><textarea id="report" class="text" placeholder="オプション顧客レポートを全文貼り付け"></textarea><button id="saveReport" class="btn">保存して公開</button><div id="reportMsg" class="copy-note"></div></div>
</section>
</main>
<script type="module">
const ADMIN='https://holpzxxeebfvkvixjuhu.supabase.co/functions/v1/lra-admin-api';
const OPT='https://holpzxxeebfvkvixjuhu.supabase.co/functions/v1/lra-option-admin-api';
let TOKEN='',ROWS=[],CUR=null;const $=s=>document.querySelector(s);
function page(id){['auth','listPage','detail'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function dt(v){return v?new Date(v).toLocaleString('ja-JP'):'—'}
async function call(url,body,auth=true){const h={'content-type':'application/json'};if(auth&&TOKEN)h.authorization='Bearer '+TOKEN;const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'通信エラー');return j}
function product(c){return({REANALYSIS:'再分析単体',THEME:'特定テーマ分析',TRACKING_7D:'7日ミニ追跡'})[c]||c}
function badge(s){const done=['delivered','completed'].includes(s),pending=['submitted','review_wait','input_required','tracking_active','paid'].includes(s);return `<span class="badge ${done?'done':pending?'pending':''}">${esc(s)}</span>`}
$('#login').onclick=async()=>{try{const j=await call(ADMIN,{action:'login_pin',pin:$('#pin').value},false);TOKEN=j.token;await load()}catch(e){$('#msg').textContent=e.message;$('#msg').className='lead bad'}};$('#pin').onkeydown=e=>{if(e.key==='Enter')$('#login').click()};
async function load(){page('listPage');const j=await call(OPT,{action:'list'});ROWS=j.orders||[];render()}
function render(){const q=$('#search').value.trim().toLowerCase(),x=ROWS.filter(r=>!q||[r.order_ref,r.user_id,r.lra_id,r.product_name,r.product_code].some(v=>String(v||'').toLowerCase().includes(q)));$('#count').textContent=`全 ${ROWS.length}件 / 表示 ${x.length}件`;$('#list').innerHTML=x.length?x.map(r=>`<button class="item" data-ref="${esc(r.order_ref)}"><b>${esc(r.product_name||product(r.product_code))}</b> ${badge(r.status)}<div class="meta">${esc(r.order_ref)}<br>${esc(r.lra_id)}｜分析 ${Number(r.base_analysis_count)}回目<br>User-ID：${esc(r.user_id)}<br>更新：${dt(r.updated_at)}</div></button>`).join(''):'<div class="empty">オプション案件はありません。</div>'}
$('#search').oninput=render;$('#refresh').onclick=load;$('#list').onclick=e=>{const b=e.target.closest('[data-ref]');if(b)open(b.dataset.ref)};$('#back').onclick=load;
function packet(o){const entries=(o.tracking_entries||[]).map(x=>`DAY ${x.day_number} / ${x.entry_date}\n${JSON.stringify(x.payload,null,2)}`).join('\n\n');return `━━━━━━━━━━━━━━━━━━\nLRA OPTION ANALYSIS PACKET\n━━━━━━━━━━━━━━━━━━\nOPTION_ORDER_REF: ${o.order_ref}\nOPTION_CODE: ${o.product_code}\nOPTION_NAME: ${o.product_name}\nUSER_ID: ${o.user_id}\nLRA-ID: ${o.lra_id}\nBASE_ANALYSIS_COUNT: ${o.base_analysis_count}\n\n[BASE_LRA_ANALYSIS_RESULT]\n${o.base_result?.analysis_result_text||''}\n\n[BASE_CLIENT_REPORT]\n${o.base_result?.client_report_text||''}\n\n[OPTION_INPUT]\n${JSON.stringify(o.input_payload||{},null,2)}\n\n[TRACKING_ENTRIES]\n${entries}\n\n[ANALYSIS_START]\n分析開始`;}
async function open(ref){const j=await call(OPT,{action:'get',order_ref:ref});CUR=j.order;page('detail');$('#title').textContent=CUR.product_name;$('#meta').textContent=`${CUR.order_ref}｜${CUR.lra_id}｜対象：分析 ${CUR.base_analysis_count}回目｜User-ID：${CUR.user_id}`;$('#status').innerHTML=badge(CUR.status);$('#input').textContent=CUR.product_code==='TRACKING_7D'?(CUR.tracking_entries||[]).map(x=>`DAY ${x.day_number} / ${x.entry_date}\n${JSON.stringify(x.payload,null,2)}`).join('\n\n')||'まだ記録がありません。':JSON.stringify(CUR.input_payload||{},null,2);$('#baseAnalysis').textContent=CUR.base_result?.analysis_result_text||'元の内部分析結果がありません。';$('#analysis').value=CUR.analysis_result_text||'';$('#report').value=CUR.client_report_text||'';$('#analysisMsg').textContent='';$('#reportMsg').textContent='';$('#copyMsg').textContent=''}
$('#copy').onclick=async()=>{if(!CUR)return;try{await navigator.clipboard.writeText(packet(CUR));$('#copyMsg').textContent='コピーしました。';$('#copyMsg').className='copy-note ok'}catch{$('#copyMsg').textContent='コピーできませんでした。';$('#copyMsg').className='copy-note bad'}};
$('#saveAnalysis').onclick=async()=>{if(!CUR)return;try{const j=await call(OPT,{action:'save_analysis',order_ref:CUR.order_ref,analysis_result_text:$('#analysis').value});$('#analysisMsg').textContent=`保存しました：${j.status}`;$('#analysisMsg').className='copy-note ok';CUR.status=j.status}catch(e){$('#analysisMsg').textContent=e.message;$('#analysisMsg').className='copy-note bad'}};
$('#saveReport').onclick=async()=>{if(!CUR)return;try{const j=await call(OPT,{action:'save_report',order_ref:CUR.order_ref,client_report_text:$('#report').value});$('#reportMsg').textContent='保存して公開しました。';$('#reportMsg').className='copy-note ok';CUR.status=j.status}catch(e){$('#reportMsg').textContent=e.message;$('#reportMsg').className='copy-note bad'}};
</script></body></html>
