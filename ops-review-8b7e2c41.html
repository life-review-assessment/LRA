<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f2ed"><meta name="robots" content="noindex,nofollow,noarchive"><title>LRA</title><style>:root{--bg:#f4f2ed;--ink:#11110f;--muted:#6d685f;--line:rgba(17,17,15,.16);--card:#faf8f3}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:30px 18px 90px}.top{border-top:1px solid var(--ink);padding-top:20px;margin-bottom:30px}.ey{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:700}.title{font:400 clamp(38px,10vw,58px)/1.08 Georgia,"Yu Mincho",serif;letter-spacing:-.04em;margin:12px 0 18px}.lead{font-size:13px;line-height:1.85;color:#575149}.hidden{display:none!important}.panel{background:var(--card);border:1px solid var(--line);padding:18px;margin:16px 0}.field{width:100%;min-height:52px;border:1px solid var(--line);background:#fff9;padding:13px 14px;font-size:16px;margin:8px 0}.btn{min-height:48px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:0 16px;font-weight:700}.btn.dark{background:var(--ink);color:var(--bg)}.btn.small{min-height:40px;padding:0 12px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.msg{min-height:22px;font-size:12px;line-height:1.7;color:var(--muted);margin-top:12px}.bad{color:#8b2424}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{border:1px solid var(--line);background:#fff6;padding:15px}.stat span{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em}.stat b{display:block;font:400 31px Georgia,serif;margin-top:4px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:16px 0}.record{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff6;padding:16px;margin:10px 0}.record .id{font-weight:800;font-size:14px;word-break:break-all}.record .meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11px;color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);padding:4px 8px;font-size:10px;margin-top:8px}.detailHead{border-bottom:1px solid var(--ink);padding-bottom:18px;margin:18px 0}.detailHead h2{font:400 28px/1.2 Georgia,"Yu Mincho",serif;margin:12px 0 7px;word-break:break-all}.detailMeta{font-size:11px;line-height:1.8;color:var(--muted)}.sectionTitle{font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:700;margin:26px 0 8px}.qa{border-top:1px solid var(--line);padding:14px 0}.qa b{display:block;font-size:12px;line-height:1.6;margin-bottom:7px}.qa p{margin:0;font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word}.empty{font-size:13px;color:var(--muted);padding:18px 0}.statusrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:16px 0}.footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}@media(max-width:480px){.record .meta{display:block}.record .meta span{display:block;margin-top:4px}}</style></head><body><main class="wrap"><div class="top"><div class="ey">LRA PRIVATE OPERATOR</div></div><section id="auth"><h1 class="title">管理画面</h1><p class="lead">回答の受付・内容確認・状態変更を行います。認証前はデータを表示しません。</p><div id="setupBox" class="panel hidden"><b>初回管理者登録</b><p class="lead">管理に使用するメールアドレスを登録します。</p><input id="email" class="field" type="email" autocomplete="email" placeholder="管理者メールアドレス"><button id="setupSend" class="btn dark">認証コードを送る →</button></div><div id="loginBox" class="panel hidden"><b>管理者ログイン</b><p class="lead">登録済みメールアドレスへ6桁の認証コードを送ります。</p><button id="loginSend" class="btn dark">認証コードを受け取る →</button></div><div id="verifyBox" class="panel hidden"><b>6桁の認証コード</b><input id="otp" class="field" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><div class="actions"><button id="verify" class="btn dark">認証する →</button><button id="resend" class="btn">再送</button></div></div><p id="msg" class="msg"></p></section><section id="dash" class="hidden"><div class="ey">RECEIVED</div><h1 class="title">回答一覧</h1><div class="stats"><div class="stat"><span>受付件数</span><b id="total">0</b></div><div class="stat"><span>分析待ち</span><b id="waiting">0</b></div></div><div class="toolbar"><input id="search" class="field" placeholder="LRA-ID / 利用者ID"><button id="refresh" class="btn small">更新</button></div><div id="records"></div><div class="actions"><button id="logout" class="btn">ログアウト</button></div></section><section id="detail" class="hidden"><button id="back" class="btn small">← 一覧へ</button><div class="detailHead"><div class="ey">DETAIL</div><h2 id="detailId"></h2><div id="detailMeta" class="detailMeta"></div></div><div class="statusrow"><select id="status" class="field"><option>受付</option><option>回答中</option><option>分析待ち</option><option>分析中</option><option>レビュー待ち</option><option>完了</option><option>納品済み</option></select><button id="saveStatus" class="btn dark">保存</button></div><div id="answerSections"></div></section><div class="footer">LRA / operator access only</div></main><script>const API='https://holpzxxeebfvkvixjuhu.supabase.co/functions/v1/lra-admin-api';const KEY='lra.operator.session.v1';let rows=[],current=null,challenge='',mode='';let setup=(location.hash.match(/(?:^#|&)setup=([^&]+)/)||[])[1]||'';if(setup)setup=decodeURIComponent(setup);const $=s=>document.querySelector(s);function vis(id){['auth','dash','detail'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}function authBox(id){['setupBox','loginBox','verifyBox'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}function message(t,b=false){$('#msg').textContent=t||'';$('#msg').className='msg'+(b?' bad':'')}function token(){return sessionStorage.getItem(KEY)||''}async function call(body,withAuth=false){const h={'content-type':'application/json'};if(withAuth&&token())h.authorization='Bearer '+token();const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(body),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'通信エラー');return j}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function cleanSetup(){history.replaceState({},'',location.pathname+location.search);setup=''}async function boot(){vis('auth');const t=token();if(t){try{const s=await call({action:'session'},true);if(s.ok){await openDash();return}}catch{}sessionStorage.removeItem(KEY)}try{const st=await call({action:'state'});if(!st.claimed&&setup){authBox('setupBox');message('初回登録を行ってください。')}else if(!st.claimed){authBox('loginBox');message('初回設定リンクが必要です。',true)}else{authBox('loginBox')}}catch(e){message(e.message,true)}}$('#setupSend').onclick=async()=>{try{message('送信中…');const j=await call({action:'bootstrap_send',setup_token:setup,email:$('#email').value.trim()});challenge=j.challenge;mode='setup';authBox('verifyBox');message('認証コードをメールへ送りました。')}catch(e){message(e.message,true)}};$('#loginSend').onclick=async()=>{try{message('送信中…');const j=await call({action:'login_send'});challenge=j.challenge;mode='login';authBox('verifyBox');message('認証コードをメールへ送りました。')}catch(e){message(e.message,true)}};$('#resend').onclick=()=>mode==='setup'?$('#setupSend').click():$('#loginSend').click();$('#verify').onclick=async()=>{try{const action=mode==='setup'?'bootstrap_verify':'login_verify';const j=await call({action,setup_token:setup,challenge_id:challenge,code:$('#otp').value.trim()});sessionStorage.setItem(KEY,j.token);cleanSetup();await openDash()}catch(e){message(e.message,true)}};async function openDash(){vis('dash');await load()}async function load(){try{const j=await call({action:'list'},true);rows=j.records||[];render()}catch(e){sessionStorage.removeItem(KEY);vis('auth');authBox('loginBox');message('認証が切れました。もう一度ログインしてください。',true)}}function render(){const n=$('#search').value.trim().toLowerCase();const list=rows.filter(r=>!n||String(r.lra_id||'').toLowerCase().includes(n)||String(r.user_id||'').toLowerCase().includes(n));$('#total').textContent=rows.length;$('#waiting').textContent=rows.filter(r=>['分析待ち','分析中','レビュー待ち'].includes(r.status)).length;$('#records').innerHTML=list.length?list.map(r=>'<button class="record" data-id="'+esc(r.lra_id)+'"><div class="id">'+esc(r.lra_id)+'</div><span class="pill">'+esc(r.status)+'</span><div class="meta"><span>'+esc(r.user_id||'利用者IDなし')+'</span><span>'+esc(r.plan_name||r.plan_code||'')+'</span></div><div class="meta"><span>分析 '+esc(r.analysis_count||1)+'回目</span><span>'+new Date(r.updated_at).toLocaleString('ja-JP')+'</span></div></button>').join(''):'<p class="empty">該当データはありません。</p>'}$('#search').oninput=render;$('#refresh').onclick=load;$('#records').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openRecord(b.dataset.id)};function answerText(v){if(Array.isArray(v))return v.join(', ');const map={'0':'該当なし','1':'1回','2':'2〜3回','3':'4回以上','4':'ほぼ毎日','U':'わからない','S':'答えたくない'};return map[String(v)]||String(v??'')}function section(title,items){if(!items?.length)return'';return'<div class="sectionTitle">'+title+'</div>'+items.map(x=>'<div class="qa"><b>'+esc(x.text||x.questionId)+'</b><p>'+esc(answerText(x.answer))+'</p></div>').join('')}async function openRecord(id){try{const j=await call({action:'get',lra_id:id},true);current=j.record;vis('detail');$('#detailId').textContent=current.lra_id;$('#detailMeta').innerHTML='利用者ID：'+esc(current.user_id||'—')+'<br>プラン：'+esc(current.plan_name||current.plan_code||'')+'<br>分析回数：'+esc(current.analysis_count||1)+'<br>更新：'+new Date(current.updated_at).toLocaleString('ja-JP');$('#status').value=current.status;const p=current.analysis_packet||{};let html='';html+=section('全体確認 / CORE SCAN',p.core);html+=section('追加確認 / ADAPTIVE SCAN',p.adaptive);html+=section('出来事 / EVENT TRACE',p.eventTrace);html+=section('振り返り',p.reflection);if(!html){html='<div class="sectionTitle">回答内容</div>'+Object.entries(current.answers||{}).map(([k,v])=>'<div class="qa"><b>'+esc(k)+'</b><p>'+esc(answerText(v))+'</p></div>').join('')}$('#answerSections').innerHTML=html||'<p class="empty">回答がありません。</p>';scrollTo(0,0)}catch(e){alert(e.message)}}$('#back').onclick=()=>{vis('dash');scrollTo(0,0)};$('#saveStatus').onclick=async()=>{if(!current)return;try{await call({action:'save_status',lra_id:current.lra_id,status:$('#status').value},true);current.status=$('#status').value;await load();vis('detail')}catch(e){alert(e.message)}};$('#logout').onclick=async()=>{try{await call({action:'logout'},true)}catch{}sessionStorage.removeItem(KEY);location.reload()};boot();</script></body></html>
