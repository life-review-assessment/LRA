<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./assets/style.css"><title>LRA | プライバシーポリシー</title></head><body><main class="app-wrap"><section class="app card"><div class="eyebrow">LRA</div><h1 class="display">プライバシーポリシー</h1><p class="lead">現在のLRAでは、回答内容、LRA-ID、利用者ID、利用プラン、分析履歴は利用者のブラウザ内に保存されます。LRAの公開Webページが、これらの回答データや利用者情報を外部サーバーへ自動送信することはありません。分析を依頼する場合は、利用者が明示的に共有した分析用データだけを取り扱います。氏名、メールアドレスその他の個人情報を公開ページへ表示する設計にはしません。保存データは利用端末・ブラウザの保存領域に依存します。</p><div class="actions"><a class="btn" href="./">LRAへ戻る</a></div></section></main></body></html>
